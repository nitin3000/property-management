spring.application.name=demo

# Dynamic Database Configuration (AWS Overrides if present, falls back to local)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:propdb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppassword}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080
